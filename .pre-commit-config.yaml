# Pre-commit configuration
# Install pre-commit: pip install pre-commit
# Install hooks: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        description: Trim trailing whitespace
      - id: end-of-file-fixer
        description: Ensure files end with a newline
      - id: check-yaml
        description: Check YAML syntax
        args: ['--multi']
      - id: check-json
        description: Check JSON syntax
      - id: check-xml
        description: Check XML syntax
      - id: check-toml
        description: Check TOML syntax
      - id: check-added-large-files
        description: Check for large files (>500KB)
        args: ['--maxkb=500']
      - id: check-case-conflict
        description: Check for case conflicts in filenames
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-executables-have-shebangs
        description: Ensure executables have shebangs
      - id: check-shebang-scripts-are-executable
        description: Ensure shebang scripts are executable
      - id: mixed-line-ending
        description: Check for mixed line endings
        args: ['--fix=lf']

  # Python specific hooks (uncomment if using Python)
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        description: Format Python code with Black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        description: Sort Python imports
        args: ["--profile", "black"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        description: Lint Python code with flake8
        additional_dependencies: [flake8-docstrings]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        description: Type check Python code with mypy
        # additional_dependencies: [types-all]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        description: Detect secrets in code
        # args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Secret Scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Markdown formatting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        description: Lint Markdown files
        args: ['--fix']
        files: \.md$

  # Commit message formatting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        description: Check commit message format
        stages: [commit-msg]

  # Shell script linting (if using shell scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        description: Lint shell scripts
