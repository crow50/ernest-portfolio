name: Bundle Audit

on:
  push:
  pull_request:
    branches:
        - main
  schedule:
    # Run weekly on Fridays at 9 AM UTC
    - cron: '0 9 * * 5'
  workflow_dispatch:



jobs:
  bundle-audit:
    name: Bundle Audit Check
    runs-on: ubuntu-latest

    # Set default working directory
    defaults:
      run:
          working-directory: ./portfolio-site

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install bundle-audit
        run: |
          gem install bundler-audit
          bundle audit --update

      - name: Run bundle audit
        run: bundle audit check --verbose

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Bundle Vulnerability Detected',
              body: 'Bundle audit has detected dependency vulnerabilities. Please review the workflow logs and update dependencies.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['security', 'dependencies']
            })