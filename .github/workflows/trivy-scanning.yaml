name: Trivy Container Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - 'portfolio-site/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    # Set permissions for the job to allow uploading SARIF reports
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # Building the Docker image to be scanned
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # 4.4.1

      - name: Build Docker image
        run: docker build -t ernest-portfolio:${{ github.sha }} .

        # Scanning the Docker image with Trivy
        # Step will normally fail if CRITICAL or HIGH severity vulnerabilities are found
        # SHA Pinning prevents release jacking https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v.0.36.0
        with:
          image-ref: ernest-portfolio:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH'

        # Generating SARIF report with Trivy
      - name: Run Trivy and generate SARIF report
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v.0.36.0
        if: always()
        with:
          image-ref: ernest-portfolio:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          skip-setup-trivy: 'true' # Reuse Trivy binary from the action's cache to speed up setup

        # Uploading SARIF report to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@a7afe0a2d717fe23bf93c8d8239d4f43c4a40f02 # v2.27.0
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'trivy-container-scan'
