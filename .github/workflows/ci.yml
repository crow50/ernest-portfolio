name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio-site

    steps:

      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'portfolio-site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'portfolio-site/package-lock.json'


      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Create issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        with:
          filename: .github/workflows/ISSUE_TEMPLATE/ci-npm-audit.md
          update-existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    continue-on-error: true


  astro-check:
    name: Astro Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio-site

    steps:

      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'portfolio-site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'portfolio-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro Check
        run: npx astro check

      - name: Create issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        with:
          filename: .github/workflows/ISSUE_TEMPLATE/ci-astro-check.md
          update-existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  npm-build:
    name: NPM Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio-site

    steps:

      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'portfolio-site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'portfolio-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Build
        run: npm run build

      - name: Create issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        with:
          filename: .github/workflows/ISSUE_TEMPLATE/ci-build.md
          update-existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
