# Serves the container build. Cloudflare Pages is production and reads
# public/_headers; this file is the homelab equivalent. The header block
# below must stay in step with public/_headers.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy here. Astro emits one as a <meta> tag with
    # per-build hashes; a second policy would be enforced as an intersection
    # and would block its inline font-variable styles.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Hashed assets are immutable; everything else is revalidated.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
